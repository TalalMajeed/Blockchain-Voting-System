name: Deploy Backend to Cloud Run

on:
  push:
    branches:
      - master
    paths:
      - "Backend-API/**"
      - ".github/workflows/deploy-backend.yaml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup GCloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --project=${{ secrets.GCP_PROJECT_ID }}

      - name: Set up Doppler
        uses: dopplerhq/cli-action@v2
        with:
          doppler_token: ${{ secrets.DOPPLER_BACKEND_TOKEN }}
          doppler_project: ${{ secrets.DOPPLER_BACKEND_PROJECT }}
          doppler_config: ${{ secrets.DOPPLER_CONFIG }}

      - name: Download .env from Doppler
        run: doppler secrets download --no-file --format env > .env
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_BACKEND_TOKEN }}

      - name: Move and cat .env
        run: |
          mv .env ./Backend-API/.env
          cat ./Backend-API/.env

      - name: Build Backend Docker image
        run: docker build -t us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/primary-repository/voting-api ./Backend-API

      - name: Push Backend Docker image
        run: docker push us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/primary-repository/voting-api

      - name: Deploy Backend to Cloud Run
        run: |
          gcloud run deploy voting-api \
            --image us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/primary-repository/voting-api \
            --region ${{ secrets.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --port=5500
